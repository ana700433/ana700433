<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Anamika Kumari, Marketing Analytics">
  <style>
    .t{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
    .m{font-family:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
    .name{font-size:58px;font-weight:800;fill:#F3F5FB;letter-spacing:-1.5px}
    .role{font-size:22px;fill:#9AA4C2}
    .eyebrow{font-size:13px;fill:#FF9272;letter-spacing:3px}
    .tag{font-size:13px;fill:#C9D3F5}
    .line{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.4s .4s ease-out forwards}
    .l2{animation-delay:.9s;stroke-width:3;opacity:.7}
    .dot{opacity:0;animation:pop .5s 2.6s ease-out forwards}
    .pulse{transform-origin:1102px 74px;animation:pulse 2.4s 3s ease-out infinite;opacity:0}
    .bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow 1s ease-out forwards}
    .fade{opacity:0;animation:fade .8s ease-out forwards}
    .blob{animation:drift 14s ease-in-out infinite alternate}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{to{opacity:1}}
    @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
    @keyframes grow{to{transform:scaleY(1)}}
    @keyframes fade{to{opacity:1}}
    @keyframes drift{to{transform:translate(-60px,20px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.line{stroke-dashoffset:0}.dot,.fade{opacity:1}.bar{transform:none}}
  </style>
  <defs>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 40) scale(380 260)">
      <stop stop-color="#2E54E8" stop-opacity=".55"/><stop offset="1" stop-color="#2E54E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(760 300) scale(320 200)">
      <stop stop-color="#F26A45" stop-opacity=".35"/><stop offset="1" stop-color="#F26A45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1C2A55" stroke-width="1"/>
    </pattern>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3FD9B4" stop-opacity=".28"/><stop offset="1" stop-color="#3FD9B4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="#0B1330"/>
    <rect width="1200" height="300" fill="url(#grid)" opacity=".55"/>
    <rect class="blob" width="1200" height="300" fill="url(#g1)"/>
    <rect width="1200" height="300" fill="url(#g2)"/>

    <!-- bars -->
    <g opacity=".9">
      <rect class="bar" x="700" y="200" width="26" height="60" rx="5" fill="#2E54E8" style="animation-delay:.2s"/>
      <rect class="bar" x="738" y="180" width="26" height="80" rx="5" fill="#2E54E8" style="animation-delay:.3s"/>
      <rect class="bar" x="776" y="190" width="26" height="70" rx="5" fill="#2E54E8" style="animation-delay:.4s"/>
      <rect class="bar" x="814" y="160" width="26" height="100" rx="5" fill="#2E54E8" style="animation-delay:.5s"/>
      <rect class="bar" x="852" y="140" width="26" height="120" rx="5" fill="#4C6FF0" style="animation-delay:.6s"/>
      <rect class="bar" x="890" y="150" width="26" height="110" rx="5" fill="#4C6FF0" style="animation-delay:.7s"/>
      <rect class="bar" x="928" y="120" width="26" height="140" rx="5" fill="#6A88F5" style="animation-delay:.8s"/>
      <rect class="bar" x="966" y="104" width="26" height="156" rx="5" fill="#6A88F5" style="animation-delay:.9s"/>
      <rect class="bar" x="1004" y="112" width="26" height="148" rx="5" fill="#809BFF" style="animation-delay:1s"/>
      <rect class="bar" x="1042" y="90" width="26" height="170" rx="5" fill="#809BFF" style="animation-delay:1.1s"/>
      <rect class="bar" x="1080" y="78" width="26" height="182" rx="5" fill="#9DB2FF" style="animation-delay:1.2s"/>
    </g>
    <path class="fade" style="animation-delay:2s" d="M690 214 C 760 205, 800 186, 850 168 S 950 130, 1000 112 S 1070 84, 1102 74 L1102 260 L690 260 Z" fill="url(#area)"/>
    <path class="line l2" d="M690 236 C 760 230, 820 222, 880 206 S 990 176, 1102 160" stroke="#FF9272"/>
    <path class="line" d="M690 214 C 760 205, 800 186, 850 168 S 950 130, 1000 112 S 1070 84, 1102 74" stroke="#3FD9B4"/>
    <circle class="pulse" cx="1102" cy="74" r="7" fill="#3FD9B4"/>
    <circle class="dot" cx="1102" cy="74" r="7" fill="#3FD9B4"/>
    <g class="fade" style="animation-delay:2.8s">
      <rect x="992" y="26" width="166" height="34" rx="17" fill="#0B1330" stroke="#3FD9B4" stroke-opacity=".6"/>
      <text class="m" x="1075" y="48" text-anchor="middle" font-size="13" fill="#3FD9B4">retention 76 → 88%</text>
    </g>

    <!-- text -->
    <text class="m eyebrow fade" x="64" y="88" style="animation-delay:.1s">MARKETING ANALYTICS · CHICAGO</text>
    <text class="t name fade" x="62" y="152" style="animation-delay:.25s">Anamika Kumari</text>
    <text class="t role fade" x="64" y="192" style="animation-delay:.45s">I find the story hiding in the spreadsheet.</text>
    <g class="fade" style="animation-delay:.7s">
      <rect x="64" y="220" width="64" height="30" rx="15" fill="#18234D"/><text class="m tag" x="96" y="240" text-anchor="middle">MMM</text>
      <rect x="138" y="220" width="104" height="30" rx="15" fill="#18234D"/><text class="m tag" x="190" y="240" text-anchor="middle">Attribution</text>
      <rect x="252" y="220" width="92" height="30" rx="15" fill="#18234D"/><text class="m tag" x="298" y="240" text-anchor="middle">CLV · RFM</text>
      <rect x="354" y="220" width="96" height="30" rx="15" fill="#18234D"/><text class="m tag" x="402" y="240" text-anchor="middle">A/B tests</text>
      <rect x="460" y="220" width="64" height="30" rx="15" fill="#18234D"/><text class="m tag" x="492" y="240" text-anchor="middle">SQL</text>
    </g>
  </g>
</svg>
